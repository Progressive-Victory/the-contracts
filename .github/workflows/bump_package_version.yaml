name: Bump Package Version
on:
  pull_request:
    types: [edited]

jobs:
  bump_package_version:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Retrieve Update Type
        shell: bash {0}
        env:
          BODY: ${{ github.event.pull_request.body }}
        run: ./.github/scripts/extract_update_type.sh "$BODY"
        id: extract_update_type

      - name: Bump Version
        shell: bash
        env:
          UPDATE_TYPE: ${{ steps.extract_update_type.outputs.update_type }}
        run: echo "$UPDATE_TYPE"