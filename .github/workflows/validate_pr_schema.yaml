name: Validate PR Schema
on:
  pull_request:
    types: [opened,edited,reopened]
    branches: [dev]

jobs:
  validate_pr_schema:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Retrieve and Validate Update Type
        env:
          BODY: ${{ github.event.pull_request.body }}
        run: |
          read val < <(echo "$BODY" | grep -E '^change: (major|minor|patch)$')
          if [ -z "$val" ]; then exit 1; fi

